<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Bindu — loto e colonna</title>
  <desc>Un loto rosa aperto sopra quattro vertebre lavanda, su fondo prugna.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65445F"/><stop offset="1" stop-color="#402C42"/>
    </linearGradient>
    <linearGradient id="petalo" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FAE0DF"/><stop offset="1" stop-color="#E5A8C5"/>
    </linearGradient>
  </defs>
  <!-- Fondo pieno: gli angoli e le maschere sono applicati dal sistema operativo. -->
  <rect width="512" height="512" fill="url(#fondo)"/>
